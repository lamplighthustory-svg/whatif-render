name: voice
on:
  push:
    paths: ['voice_job/job.json']
  workflow_dispatch:
concurrency:
  group: voice
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: voice_job/job.json, sparse-checkout-cone-mode: false }
      - id: p
        run: |
          N=$(python3 -c "import json;print(json.load(open('voice_job/job.json'))['parts'])")
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "parts=$(python3 -c "print(list(range($N)))")" >> $GITHUB_OUTPUT

  part:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        k: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: runner/voice_requirements.txt }
      - uses: actions/cache@v4
        with: { path: ~/supertonic3, key: supertonic3-v1 }
      - name: Install
        timeout-minutes: 5
        run: pip install -q -r runner/voice_requirements.txt
      - name: Voice part ${{ matrix.k }}
        timeout-minutes: 30
        run: python runner/voice_part.py ${{ matrix.k }} ${{ needs.plan.outputs.n }} out
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.k }}
          path: out/*.wav
          retention-days: 1

  join:
    needs: part
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'voice-*', merge-multiple: true, path: voices }
      - run: ls voices | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: voices
          path: voices/*.wav
          retention-days: 1
