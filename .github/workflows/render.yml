name: render
on:
  push:
    paths: ['job/job.json']
  workflow_dispatch:
concurrency:
  group: render
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: job/job.json, sparse-checkout-cone-mode: false }
      - id: p
        run: |
          N=$(python3 -c "import json;print(json.load(open('job/job.json'))['parts'])")
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "parts=$(python3 -c "print(list(range($N)))")" >> $GITHUB_OUTPUT

  part:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        k: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: runner/requirements.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-1.65.2 }
      - name: Install tools
        timeout-minutes: 5
        run: |
          # no apt: the runner image already has Chrome's libraries + Liberation fonts; ffmpeg comes from pip
          pip install -q -r runner/requirements.txt
          python -m playwright install chromium
          mkdir -p ~/.fonts ~/.config/fontconfig
          python runner/make_fonts.py
          cp runner/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          for q in sans-serif "Arial:weight=210" "Arial:bold" Inter "Comic Sans MS:bold" Georgia monospace; do echo "$q -> $(fc-match "$q")"; done
      - name: Render part ${{ matrix.k }}
        timeout-minutes: 60
        run: python runner/render_part.py ${{ matrix.k }} ${{ needs.plan.outputs.n }} part_$(printf %03d ${{ matrix.k }}).mp4
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.k }}
          path: part_*.mp4
          retention-days: 1
          compression-level: 0

  join:
    needs: part
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-*', merge-multiple: true, path: parts }
      - name: Join parts
        timeout-minutes: 10
        run: |
          pip install -q imageio-ffmpeg==0.6.0
          FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          ls parts/*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          cat list.txt
          $FF -v error -y -f concat -safe 0 -i list.txt -c copy video_only.mp4
          ls -la video_only.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video_only
          path: video_only.mp4
          retention-days: 1
          compression-level: 0
