</defs><g id="stage"></g></svg><script>// Ifverse-style cinematic stickman renderer. render(t) draws one frame (1600x900 space).
const W = 1600, H = 900;
let DATA = null;
const BLK = '#111116';
let RIM = '#FF9F45';
let TH = { rim: '#FF9F45', ring: '#F5A33A', gear: 'beanie', icon: 'eye' };

// ---------------- characters ----------------
const LOOK = {
  nate: { beanie: '#2E4C91', band: '#4A6FC4', hero: true },
  fire: { jacket: '#3B3D2E', stripe: '#D6DF4E' },
  hale: { tux: true },
  aide: { coat: '#2A2A30' },
};
const COATS = ['#C9A0A6', '#8FA6C1', '#A88B6E', '#9BB0A0', '#B7A3C9', '#7E8FA8'];
const POSE = { idle: [10, 10], wide: [118, 118], hips: [36, 36], bag: [10, 22], shrug: [64, 64], point: [10, 88], knee: [40, 40], laugh: [30, 120], phone: [10, 150], mic: [10, 115] };
function armEnd(sx, sy, ang, len, side) { const r = ang * Math.PI / 180; return [sx + side * Math.sin(r) * len, sy + Math.cos(r) * len]; }

function face(a, t, amp) {

  else if (e === 'smug' || e === 'cool') s += `<path d="M${-ex - 8} ${ey - 1} h16 a8 8 0 0 1 -16 0 Z M${ex - 8} ${ey - 1} h16 a8 8 0 0 1 -16 0 Z" fill="#fff"/><circle cx="${-ex + 2 + lk}" cy="${ey + 3}" r="3" fill="${BLK}"/><circle cx="${ex + 2 + lk}" cy="${ey + 3}" r="3" fill="${BLK}"/>`;
  else s += `<ellipse cx="${-ex}" cy="${ey}" rx="7" ry="9" fill="#fff"/><ellipse cx="${ex}" cy="${ey}" rx="7" ry="9" fill="#fff"/><circle cx="${-ex + lk}" cy="${ey + 1}" r="3.3" fill="${BLK}"/><circle cx="${ex + lk}" cy="${ey + 1}" r="3.3" fill="${BLK}"/>`;
  // brows
  if (e === 'shock') s += `<path d="M${-ex - 9} ${ey - 20} q9 -7 18 0 M${ex - 9} ${ey - 20} q9 -7 18 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else if (e === 'determined' || e === 'angry') s += `<path d="M${-ex - 10} ${ey - 19} l18 6 M${ex + 10} ${ey - 19} l-18 6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  else if (e === 'smug') s += `<path d="M${-ex - 9} ${ey - 14} h16 M${ex - 9} ${ey - 19} q9 -5 18 2" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else if (e === 'cool') s += `<path d="M${-ex - 9} ${ey - 14} h17 M${ex - 8} ${ey - 14} h17" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`;
  else if (e === 'worried') s += `<path d="M${-ex - 9} ${ey - 13} l17 -5 M${ex + 9} ${ey - 13} l-17 -5" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`;
  // mouth
  const my = 20;
  if (amp > 0.06) s += `<ellipse cx="0" cy="${my}" rx="${6 + amp * 4}" ry="${2 + amp * 8}" fill="#fff"/>`;
  else if (e === 'shock') s += `<ellipse cx="0" cy="${my + 2}" rx="7" ry="9" fill="#fff"/>`;
  else if (e === 'laugh') s += `<path d="M-13 ${my - 4} Q0 ${my + 16} 13 ${my - 4} Z" fill="#fff"/>`;
  else if (e === 'happy') s += `<path d="M-10 ${my - 2} Q0 ${my + 9} 10 ${my - 2}" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else if (e === 'smug') s += `<path d="M-7 ${my + 1} Q4 ${my + 6} 12 ${my - 4}" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else if (e === 'determined' || e === 'cool' || e === 'worried') s += `<path d="M-9 ${my} H9" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`;
  else s += `<path d="M-8 ${my - 1} Q0 ${my + 5} 8 ${my - 1}" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;

}

function fig(a0, t) {
  const a = { ...a0 };
  if (a0.at) for (const ch of a0.at) if (t >= ch.t) Object.assign(a, ch);
  const L = LOOK[a.who] || {};
  const s = a.s || 1;
  const sd = (a.seed || 1) * 1.7 + (a.x || 0) * 0.011;
  let x = a.x, y = a.y;
  let walking = false;
  let wp = 0, wk = 0; // walk phase (radians, distance-driven so feet stay planted) and walk weight (ease in/out)
  if (a.move) { const k = clamp((t - a.move.t0) / (a.move.t1 - a.move.t0), 0, 1); const kk = a.move.lin ? k : ease(k); x = lerp(a.x, a.move.x, kk); y = lerp(a.y, a.move.y ?? a.y, k); walking = k > 0 && k < 1;
    const dist = Math.hypot(x - a.x, (y - a.y) * 0.6) / s; const cyc = a.run ? 230 : 150; wp = dist / cyc * Math.PI * 2 + (a.seed || 0);
    const kd = Math.min(k, 1 - k) * (a.move.t1 - a.move.t0); wk = walking ? clamp(kd / 0.25, 0.25, 1) : 0;
    if (walking && a.flip == null && !a.back) a.flip = a.move.x < a.x; }
  const fi = Math.floor(t * DATA.fps);
  let amp = 0;
  if (a.voice && DATA.speaker[fi] === a.voice) amp = clamp(DATA.env[fi], 0, 1);
  const talking = amp > 0.06;
  const bob = walking ? (-Math.cos(wp * 2) * 5 - 4) * wk : Math.sin(t * 2.1 + sd) * 2.5 + (talking ? -Math.abs(Math.sin(t * 6.5 + sd)) * 3 : 0);
  const sway = walking ? (a.run ? 9 : 4) * wk + Math.sin(wp * 2) * 0.8 : Math.sin(t * 1.4 + sd) * 1.5 + (a.lean || 0);
  const pop = a.pop != null && t >= a.pop && t < a.pop + 0.35 ? Math.sin((t - a.pop) / 0.35 * Math.PI * 2) * (1 - (t - a.pop) / 0.35) * 0.12 : 0;
  let [la, ra] = POSE[a.pose || 'idle'] || POSE.idle;
  if (a.pose === 'idle' || a.pose === 'hips' || !a.pose) { la += Math.sin(t * 2 + sd) * 4; ra += Math.sin(t * 2 + sd + 1) * 4; }
  if (a.pose === 'wide') { la += Math.sin(t * 1.8) * 6; ra += Math.sin(t * 1.8 + 0.6) * 6; }
  if (a.pose === 'laugh') { ra += Math.sin(t * 9) * 10; }
  if (talking && (a.pose === 'idle' || !a.pose)) { ra += 8 + Math.sin(t * 1.4 + sd) * 5; }
  if (walking) { const A = (a.run ? 40 : 22) * wk; la = 12 + Math.cos(wp) * A; ra = 12 + Math.cos(wp) * A; }
  const tilt = (a.tilt || 0) + Math.sin(t * 1.2 + sd) * 2 + (talking ? Math.sin(t * 6 + sd) * 4 * amp : 0);
  const hip = -125, shY = -222, headY = -282, HR = 46;
  let g = '';
  // legs
  const leg = (dx, ph) => {
    if (a.seated) { const kx = dx * 0.6 + 62, fx = kx + 6; return `<path d="M${dx * 0.5} ${hip} L${kx} ${hip + 4} L${fx} -8" stroke="${BLK}" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="${fx + 9}" cy="-6" rx="15" ry="7" fill="${BLK}"/>`; }
    const hx = dx * 0.5, hy = hip; // whole figure is translated by bob, so feet target -bob to stay on the ground

      if (p < Math.PI) { fx = dx + Aa - 2 * Aa * (p / Math.PI); fy = 0; toe = 0; } // stance: foot planted, slides back exactly with body travel
      else { const q = (p - Math.PI) / Math.PI; fx = dx - Aa + 2 * Aa * ease(q); fy = -Math.sin(q * Math.PI) * (a.run ? 46 : 26) * wk; toe = -Math.sin(q * Math.PI) * 18; } }
    const L1 = 63, L2 = 63; let ddx = fx - hx, ddy = (fy - 2 - bob) - hy; let D = Math.hypot(ddx, ddy); if (D > L1 + L2 - 0.5) { const f = (L1 + L2 - 0.5) / D; ddx *= f; ddy *= f; D = L1 + L2 - 0.5; }
    const mx = hx + ddx / 2, my = hy + ddy / 2, hgt = Math.sqrt(Math.max(0, L1 * L1 - (D / 2) * (D / 2)));
    const kx = mx + (-ddy / D) * hgt * -1, ky = my + (ddx / D) * hgt * -1; // knee bends forward (+x)

    const ex = hx + ddx, ey = hy + ddy;

  const hoodie = L.hero && TH.hoodie;

  const arm = (sh, e) => `<line x1="${sh[0]}" y1="${sh[1]}" x2="${e[0]}" y2="${e[1]}" stroke="${sleeve || BLK}" stroke-width="${sleeve ? 20 : 13}" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1] + 3}" r="9" fill="${BLK}"/>`;

    g += `<path d="M-30 ${shY} Q-40 ${hip - 30} -34 ${hip + 18} L34 ${hip + 18} Q40 ${hip - 30} 30 ${shY} Q0 ${shY - 10} -30 ${shY} Z" fill="${L.jacket}"/>`;
    g += `<rect x="-36" y="${hip - 22}" width="72" height="9" fill="${L.stripe}"/><rect x="-33" y="${hip - 70}" width="66" height="8" fill="${L.stripe}"/><line x1="0" y1="${shY}" x2="0" y2="${hip + 16}" stroke="#25261D" stroke-width="3"/>`;
  } else if (L.tux) {
    g += `<path d="M-28 ${shY} Q-34 ${hip - 30} -26 ${hip + 10} L26 ${hip + 10} Q34 ${hip - 30} 28 ${shY} Z" fill="#17171D"/><path d="M-14 ${shY - 2} L0 ${shY + 62} L14 ${shY - 2} Z" fill="#EFECE4"/><path d="M-11 ${shY + 6} l11 6 l11 -6 v12 l-11 -6 l-11 6 Z" fill="#EFECE4" stroke="#CFCBC0" stroke-width="1"/>`;
  } else if (hoodie) {

    g += `<rect x="-36" y="${hip + 8}" width="72" height="16" rx="7" fill="${hd2}"/><path d="M-24 ${hip - 34} h48 l6 30 h-60 Z" fill="${hd2}" opacity="0.55"/>`;
    g += `<ellipse cx="0" cy="${shY - 4}" rx="38" ry="15" fill="${hd2}"/><line x1="-9" y1="${shY + 6}" x2="-11" y2="${shY + 46}" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><line x1="9" y1="${shY + 6}" x2="11" y2="${shY + 42}" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`;
  } else if (typeof EXT_CLOTHES === 'function' && EXT_CLOTHES(a, L, shY, hip)) {
    g += EXT_CLOTHES(a, L, shY, hip);
  } else if (a.coat) {
    g += `<path d="M-26 ${shY} Q-38 ${hip} -40 ${hip + 70} L40 ${hip + 70} Q38 ${hip} 26 ${shY} Z" fill="${a.coat}"/>`;
    if (a.scarf) g += `<path d="M-22 ${shY - 4} Q0 ${shY + 14} 22 ${shY - 4} L20 ${shY + 10} Q0 ${shY + 26} -20 ${shY + 10} Z" fill="${a.scarf}"/>`;
  } else {
    g += `<line x1="0" y1="${shY - 6}" x2="0" y2="${hip + 4}" stroke="${BLK}" stroke-width="24" stroke-linecap="round"/><line x1="-24" y1="${shY + 6}" x2="24" y2="${shY + 6}" stroke="${BLK}" stroke-width="14" stroke-linecap="round"/>`;
  }
  if (typeof EXT_TORSO === 'function') g += EXT_TORSO(a, L, shY, hip, t);

// silhouettes (crowds/foreground)
function blob(x, y, r, c, cam) {
  let s = `<circle cx="${x}" cy="${y - r * 1.9}" r="${r}" fill="${c || BLK}"/><path d="M${x - r * 1.5} ${y + r * 2} Q${x - r * 1.4} ${y - r * 0.6} ${x} ${y - r * 0.8} Q${x + r * 1.4} ${y - r * 0.6} ${x + r * 1.5} ${y + r * 2} Z" fill="${c || BLK}"/>`;

function crowdRow(y0, n, rmin, rmax, seed, camEvery, c) { let s = ''; for (let i = 0; i < n; i++) { const x = (i + hash(seed + i) * 0.6) * (1700 / n) - 50; const r = rmin + hash(seed + i * 3) * (rmax - rmin); s += blob(x, y0 + hash(seed + i * 7) * 30, r, c, camEvery && i % camEvery === 0); } return s; }

// ---------------- sets ----------------
function sky(top, bot) { return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sk)"/>`; }
const SETS = {
  train(t, o) {
    let s = `<rect width="1600" height="900" fill="#DCE2E7"/>`;
    const ads = ['#B9A5D6', '#E6D296', '#A9CFAE', '#E7B3B8', '#9FC3DE'];
    for (let i = 0; i < 6; i++) { const x = 40 + i * 300; s += `<rect x="${x}" y="70" width="250" height="90" rx="6" fill="${ads[i % 5]}"/><rect x="${x + 20}" y="96" width="120" height="10" rx="5" fill="#fff" opacity="0.8"/><rect x="${x + 20}" y="118" width="80" height="8" rx="4" fill="#fff" opacity="0.6"/><circle cx="${x + 200}" cy="115" r="22" fill="#fff" opacity="0.55"/>`; }
    s += `<rect y="175" width="1600" height="16" fill="#BFC8D0"/>`;
    for (let i = 0; i < 5; i++) {

// ================= ifv_places.js : REAL-PLACE location kits (ep 7+) =================
// Each kit: 3 bands (facades / sidewalk / road-or-floor), named signs, 15-25 props, bg people,
// soft light gradient + AO, glass reflections. opts: mood ('day'|'dusk'|'night'), rain, noPeople, cu (close-up variant: stronger blur via bgBlur)
const PL = {};
PL.lg = (id, x1, y1, x2, y2, stops) => `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}"${s[2] != null ? ` stop-opacity="${s[2]}"` : ''}/>`).join('')}</linearGradient>`;
PL.defs = () => `<defs>
${PL.lg('plGlass', 0, 0, 0, 1, [[0, '#9FB4C4'], [0.55, '#6E8597'], [1, '#4C5E6E']])}
${PL.lg('plGlassN', 0, 0, 0, 1, [[0, '#E9C27A'], [1, '#B07A38']])}
${PL.lg('plAO', 0, 0, 0, 1, [[0, '#000', 0], [1, '#000', 0.28]])}
${PL.lg('plAOd', 0, 0, 0, 1, [[0, '#000', 0.30], [1, '#000', 0]])}
${PL.lg('plWall', 1, 0, 0, 0, [[0, '#fff', 0.10], [1, '#000', 0.10]])}
${PL.lg('plSide', 0, 0, 0, 1, [[0, '#C9C2B6'], [1, '#ADA597']])}
${PL.lg('plRoad', 0, 0, 0, 1, [[0, '#7A7D80'], [1, '#5E6164']])}
${PL.lg('plSkyD', 0, 0, 0, 1, [[0, '#BFD6E4'], [1, '#E9E4D8']])}
${PL.lg('plSkyN', 0, 0, 0, 1, [[0, '#121A2E'], [1, '#2A2F45']])}
<radialGradient id="plLamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE3A3" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE3A3" stop-opacity="0"/></radialGradient>
<radialGradient id="plSun" cx="85%" cy="0%" r="90%"><stop offset="0" stop-color="#FFF4D6" stop-opacity="0.35"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/></radialGradient>
</defs>`;
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = v => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255)); return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1); };
const NIGHT = o => o.mood === 'night';

// ---------- building blocks ----------
PL.windowsRow = (x, y, w, n, wh, col, frame, lit) => { let s = ''; const gap = w / n; for (let i = 0; i < n; i++) { const wx = x + i * gap + gap * 0.18, ww = gap * 0.64; const on = lit && hash(x + i * 7 + y) > 0.45; s += `<rect x="${wx - 4}" y="${y - 4}" width="${ww + 8}" height="${wh + 8}" fill="${frame}"/><rect x="${wx}" y="${y}" width="${ww}" height="${wh}" fill="${on ? 'url(#plGlassN)' : col}"/><line x1="${wx + ww / 2}" y1="${y}" x2="${wx + ww / 2}" y2="${y + wh}" stroke="${frame}" stroke-width="3"/><rect x="${wx - 8}" y="${y + wh + 4}" width="${ww + 16}" height="7" fill="${shade(frame, -0.15)}"/>${on ? '' : `<path d="M${wx + 6} ${y + wh * 0.8} L${wx + ww * 0.45} ${y + 4}" stroke="#fff" stroke-opacity="0.25" stroke-width="6"/>`}`; } return s; };
PL.brick = (x, y, w, h, c) => { let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`; for (let j = 0; j < h / 14; j++) s += `<line x1="${x}" y1="${y + j * 14}" x2="${x + w}" y2="${y + j * 14}" stroke="${shade(c, -0.18)}" stroke-width="1.5"/>`; return s; };
PL.awning = (x, y, w, h, c1, c2) => { let s = ''; const n = Math.round(w / 34), sw = w / n; for (let i = 0; i < n; i++) s += `<path d="M${x + i * sw} ${y} L${x + (i + 1) * sw} ${y} L${x + (i + 1) * sw + 6} ${y + h} L${x + i * sw + 6} ${y + h} Z" fill="${i % 2 ? c2 : c1}"/>`; for (let i = 0; i < n; i++) s += `<path d="M${x + i * sw + 6} ${y + h} q${sw / 2} 18 ${sw} 0 Z" fill="${i % 2 ? c2 : c1}"/>`; s += `<rect x="${x}" y="${y + h + 4}" width="${w + 6}" height="40" fill="url(#plAOd)"/>`; return s; };
PL.signBand = (x, y, w, h, bg, txt, fc, font, fs) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bg}"/><rect x="${x}" y="${y + h - 4}" width="${w}" height="4" fill="#000" opacity="0.25"/><text x="${x + w / 2}" y="${y + h / 2 + fs * 0.36}" text-anchor="middle" font-family="${font || 'Poppins, Inter, sans-serif'}" font-weight="800" font-size="${fs || h * 0.5}" letter-spacing="${font && /serif/.test(font) ? 4 : 1.5}" fill="${fc}">${esc(txt)}</text>`;
PL.glassFront = (x, y, w, h, frame, content) => `<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" fill="${frame}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#plGlass)"/>${content || ''}<path d="M${x + w * 0.12} ${y + h} L${x + w * 0.42} ${y}" stroke="#fff" stroke-opacity="0.22" stroke-width="${w * 0.08}"/><path d="M${x + w * 0.55} ${y + h} L${x + w * 0.68} ${y}" stroke="#fff" stroke-opacity="0.14" stroke-width="${w * 0.03}"/>`;
PL.door = (x, y, w, h, c, glass) => `<rect x="${x - 5}" y="${y - 5}" width="${w + 10}" height="${h + 5}" fill="${shade(c, -0.3)}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>${glass ? `<rect x="${x + w * 0.15}" y="${y + h * 0.08}" width="${w * 0.7}" height="${h * 0.5}" fill="url(#plGlass)"/>` : `<rect x="${x + w * 0.14}" y="${y + h * 0.1}" width="${w * 0.72}" height="${h * 0.34}" fill="none" stroke="${shade(c, -0.2)}" stroke-width="4"/><rect x="${x + w * 0.14}" y="${y + h * 0.52}" width="${w * 0.72}" height="${h * 0.34}" fill="none" stroke="${shade(c, -0.2)}" stroke-width="4"/>`}<circle cx="${x + w * 0.85}" cy="${y + h * 0.6}" r="5" fill="#D8B45A"/>`;
PL.crate = (x, y, w, h, fruit, seed) => { let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#A67C4E"/><line x1="${x}" y1="${y + h / 3}" x2="${x + w}" y2="${y + h / 3}" stroke="#7E5A34" stroke-width="3"/><line x1="${x}" y1="${y + 2 * h / 3}" x2="${x + w}" y2="${y + 2 * h / 3}" stroke="#7E5A34" stroke-width="3"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#6B4A2A" stroke-width="3"/>`; const r = w / 9; for (let i = 0; i < 9; i++) { const fx = x + r + (i % 4) * (w - 2 * r) / 3 + (Math.floor(i / 4) % 2) * r * 0.6, fy = y - r * 0.4 - Math.floor(i / 4) * r * 1.1; if (fx > x + w - r * 0.6) continue; s += `<circle cx="${fx}" cy="${fy}" r="${r * 1.05}" fill="${fruit}"/><circle cx="${fx - r * 0.35}" cy="${fy - r * 0.35}" r="${r * 0.3}" fill="#fff" opacity="0.35"/>`; } return s; };
PL.priceTag = (x, y, txt) => `<rect x="${x}" y="${y}" width="58" height="30" rx="3" fill="#F4EFE2" stroke="#5A4A36" stroke-width="2"/><text x="${x + 29}" y="${y + 21}" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="15" fill="#3A2E22">${esc(txt)}</text>`;
PL.lamp = (x, y0, y1, on) => `<rect x="${x - 5}" y="${y1}" width="10" height="${y0 - y1}" fill="#2F3438"/><rect x="${x - 12}" y="${y0 - 14}" width="24" height="14" fill="#2F3438"/><path d="M${x} ${y1} q0 -24 30 -24 h14" stroke="#2F3438" stroke-width="8" fill="none"/><path d="M${x + 30} ${y1 - 24} h28 l-6 18 h-16 Z" fill="#3A4045"/>${on ? `<ellipse cx="${x + 46}" cy="${y1 - 2}" rx="70" ry="60" fill="url(#plLamp)"/>` : ''}`;
PL.bench = (x, y) => `<rect x="${x}" y="${y - 52}" width="150" height="10" rx="3" fill="#8A6440"/><rect x="${x}" y="${y - 70}" width="150" height="10" rx="3" fill="#8A6440"/><rect x="${x}" y="${y - 36}" width="150" height="12" rx="3" fill="#9C7249"/><rect x="${x + 12}" y="${y - 24}" width="8" height="24" fill="#2F3438"/><rect x="${x + 130}" y="${y - 24}" width="8" height="24" fill="#2F3438"/><ellipse cx="${x + 75}" cy="${y + 2}" rx="85" ry="7" fill="#000" opacity="0.18"/>`;
PL.trash = (x, y) => `<rect x="${x}" y="${y - 70}" width="46" height="70" rx="4" fill="#4E6B55"/><rect x="${x - 3}" y="${y - 76}" width="52" height="10" rx="3" fill="#3E5544"/>${[8, 18, 28, 38].map(d => `<line x1="${x + d}" y1="${y - 60}" x2="${x + d}" y2="${y - 8}" stroke="#3E5544" stroke-width="2"/>`).join('')}<ellipse cx="${x + 23}" cy="${y + 2}" rx="30" ry="5" fill="#000" opacity="0.2"/>`;
PL.plant = (x, y, sc, t) => { const sw = Math.sin(t * 1.3 + x) * 2; let s = `<path d="M${x - 22 * sc} ${y - 40 * sc} h${44 * sc} l-6 ${40 * sc} h${-32 * sc} Z" fill="#B0623E"/>`; for (let i = 0; i < 7; i++) { const a = -70 + i * 23 + sw; s += `<ellipse cx="${x + Math.sin(a * Math.PI / 180) * 26 * sc}" cy="${y - 62 * sc - Math.cos(a * Math.PI / 180) * 20 * sc}" rx="${10 * sc}" ry="${26 * sc}" transform="rotate(${a} ${x + Math.sin(a * Math.PI / 180) * 26 * sc} ${y - 62 * sc - Math.cos(a * Math.PI / 180) * 20 * sc})" fill="${i % 2 ? '#5F8A55' : '#4C7446'}"/>`; } return s; };
PL.car = (x, y, c, dir, night) => { const f = dir < 0 ? -1 : 1; return `<g transform="translate(${x} ${y}) scale(${f} 1)"><ellipse cx="0" cy="4" rx="150" ry="12" fill="#000" opacity="0.25"/><path d="M-150 -20 Q-150 -58 -110 -62 L-70 -64 Q-40 -110 20 -110 L60 -110 Q100 -108 120 -64 L140 -60 Q156 -56 156 -20 Z" fill="${c}"/><path d="M-60 -66 Q-34 -102 18 -102 L40 -102 L40 -66 Z M52 -102 L60 -102 Q92 -100 108 -66 L52 -66 Z" fill="url(#plGlass)"/><rect x="-150" y="-36" width="306" height="6" fill="${shade(c, -0.25)}"/><circle cx="-90" cy="-14" r="24" fill="#1E2023"/><circle cx="-90" cy="-14" r="10" fill="#9A9EA3"/><circle cx="96" cy="-14" r="24" fill="#1E2023"/><circle cx="96" cy="-14" r="10" fill="#9A9EA3"/><rect x="144" y="-50" width="12" height="10" rx="3" fill="${night ? '#FFF2B8' : '#EDE6CF'}"/>${night ? '<ellipse cx="220" cy="-40" rx="90" ry="22" fill="url(#plLamp)"/>' : ''}</g>`; };
PL.stringLights = (x1, x2, y, sag, on, t) => { let s = `<path d="M${x1} ${y} Q${(x1 + x2) / 2} ${y + sag * 2} ${x2} ${y}" stroke="#3A3530" stroke-width="2" fill="none"/>`; const n = Math.round((x2 - x1) / 40); for (let i = 1; i < n; i++) { const k = i / n, bx = lerp(x1, x2, k), by = y + 4 * sag * k * (1 - k) + 6; s += `<circle cx="${bx}" cy="${by}" r="5" fill="${on ? '#FFE7A8' : '#E8DDC0'}"/>${on ? `<circle cx="${bx}" cy="${by}" r="14" fill="#FFE7A8" opacity="${0.25 + 0.1 * Math.sin(t * 3 + i)}"/>` : ''}`; } return s; };
PL.clock = (x, y, r, t) => { const m = (t * 6) % 360, h = 300 + t * 0.5; return `<circle cx="${x}" cy="${y}" r="${r + 5}" fill="#2F3438"/><circle cx="${x}" cy="${y}" r="${r}" fill="#F3EFE4"/>${[0, 90, 180, 270].map(a => `<line x1="${x + Math.sin(a * Math.PI / 180) * r * 0.8}" y1="${y - Math.cos(a * Math.PI / 180) * r * 0.8}" x2="${x + Math.sin(a * Math.PI / 180) * r * 0.95}" y2="${y - Math.cos(a * Math.PI / 180) * r * 0.95}" stroke="#333" stroke-width="2"/>`).join('')}<line x1="${x}" y1="${y}" x2="${x + Math.sin(h * Math.PI / 180) * r * 0.5}" y2="${y - Math.cos(h * Math.PI / 180) * r * 0.5}" stroke="#222" stroke-width="3"/><line x1="${x}" y1="${y}" x2="${x + Math.sin(m * Math.PI / 180) * r * 0.8}" y2="${y - Math.cos(m * Math.PI / 180) * r * 0.8}" stroke="#222" stroke-width="2"/>`; };
// background pedestrian: real clothes, lower contrast, optional walk

PL.person = (x, y, s, seed, t, walk) => { const c = BG_COATS[Math.floor(hash(seed) * BG_COATS.length)]; const hair = ['bun', 'tail', null, null][Math.floor(hash(seed + 3) * 4)]; const hat = hash(seed + 5) > 0.75 ? shade(c[0], -0.3) : null; const a = { who: 'bg' + seed, x, y, s, coat: c[0], sleeve: c[1], hair, hat, noRim: true, seed, flip: walk ? walk < 0 : hash(seed + 9) > 0.5, pose: hash(seed + 11) > 0.6 ? 'bag' : 'idle', prop: hash(seed + 11) > 0.6 ? 'bag' : null };
  if (walk) a.move = { t0: -1, t1: 999, x: x + walk * 1000 * 0.06, lin: true };

  s += PL.windowsRow(1050, 80, 540, 4, 110, night ? '#283040' : '#7D93A3', night ? '#2A2422' : '#F4EADF', night);

  s += PL.signBand(1040, 378, 560, 58, '#F2E6D0', "ROSA'S BAKERY", '#8A3A2A', 'Georgia, serif', 30);

  s += `<rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" fill="${night ? '#1A2238' : '#A9C3D3'}"/>`;
  // street outside: buildings + lamp

};

      for (let i = 0; i < 4; i++) { const rx = m0 + (m1 - m0) * hash(k * 9 + i + side), ry0 = ta + (ba - ta) * ((t * 0.7 + hash(k + i * 3)) % 1); s += `<line x1="${rx}" y1="${ry0}" x2="${rx + side * 2}" y2="${ry0 + 14 * f1}" stroke="#8FA6C0" stroke-width="${1.2 * f1 + 0.5}" opacity="0.55"/>`; }
      if (o.passLights) { const lx = m0 + (m1 - m0) * (((t * 0.9 + k * 0.37) % 1)); s += `<circle cx="${lx}" cy="${(ta + ba) / 2}" r="${10 * f1}" fill="#FFE3A3" opacity="0.35"/>`; }
    }
    // ceiling lamp strip + grab rail
    const lc = (A.ceil + B2.ceil) / 2;
    if (k === 3) s += `<rect x="${vx - 110 * f1}" y="${lc - 14 * f1}" width="${220 * f1}" height="${26 * f1}" rx="${4 * f1}" fill="#C8BC9C" stroke="#9A9076" stroke-width="${3 * f1}"/><text x="${vx}" y="${lc + 4 * f1}" text-anchor="middle" font-family="Arial" font-weight="800" font-size="${11 * f1}" fill="#C8463A">EMERGENCY ESCAPE</text>`;

    s += `<rect x="${vx - 40 * f1}" y="${lc - 4 * f1}" width="${80 * f1}" height="${10 * f1}" rx="${4 * f1}" fill="${L > 0.5 ? '#FFF1C2' : '#6E6858'}"/>`;
  }

  for (let k = fs.length - 1; k >= 1; k--) {

      const xa = vx + side * P.aisle, xw = vx + side * (P.wall - 30 * f);
      const x0 = Math.min(xa, xw), w = Math.abs(xw - xa);
      s += `<rect x="${x0}" y="${P.floor - back}" width="${w}" height="${back * 0.62}" rx="${18 * f}" fill="#2F6B4F"/><rect x="${x0}" y="${P.floor - back}" width="${w}" height="${16 * f}" rx="${8 * f}" fill="#3D8462"/><rect x="${x0 + w * 0.06}" y="${P.floor - back * 0.4}" width="${w * 0.88}" height="${back * 0.12}" fill="#255840"/>`;
      s += `<rect x="${x0}" y="${P.floor - back * 0.38}" width="${w}" height="${back * 0.38}" fill="#1E1F1E" opacity="0.6"/>`;
      s += `<rect x="${x0 + 4 * f}" y="${P.floor - back - 6 * f}" width="${w - 8 * f}" height="${7 * f}" rx="${3 * f}" fill="#C9CED4"/><rect x="${side < 0 ? x0 + w - 26 * f : x0 + 10 * f}" y="${P.floor - back - 16 * f}" width="${16 * f}" height="${12 * f}" rx="${4 * f}" fill="none" stroke="#C9CED4" stroke-width="${3 * f}"/>`;
      if (!o.noBags && hash(k * 13 + side * 7) > 0.62) { const bx2 = x0 + w * (0.25 + 0.4 * hash(k + side)), bc = ['#B5563A', '#2F5A8A', '#7A5A9C', '#C9A13A'][Math.floor(hash(k * 3 + side) * 4)]; s += `<rect x="${bx2}" y="${P.floor - back * 0.6}" width="${70 * f}" height="${90 * f}" rx="${16 * f}" fill="${bc}"/><rect x="${bx2 + 10 * f}" y="${P.floor - back * 0.6 + 40 * f}" width="${50 * f}" height="${30 * f}" rx="${8 * f}" fill="#000" opacity="0.18"/>`; }
      if (o.puddle === k) s += `<ellipse cx="${x0 + w / 2}" cy="${P.floor - back * 0.4}" rx="${w * 0.3}" ry="${9 * f}" fill="#7FA3BE" opacity="0.55"/>`;
    }
  }
  // background kids (heads above seat backs): [side, row]
  for (const [side, row, col] of (o.kids || [])) { const f = fs[row], P = busP(f), x = vx + side * (P.aisle + (P.wall - P.aisle) * 0.45), y = P.floor - 300 * f - 34 * f; s += `<g opacity="0.92"><circle cx="${x}" cy="${y}" r="${40 * f}" fill="#16181C"/><circle cx="${x - 12 * f}" cy="${y - 4 * f}" r="${6 * f}" fill="#fff"/><circle cx="${x + 12 * f}" cy="${y - 4 * f}" r="${6 * f}" fill="#fff"/><rect x="${x - 50 * f}" y="${y + 36 * f}" width="${100 * f}" height="${30 * f}" rx="${12 * f}" fill="${col || '#5A6E86'}"/></g>`; }
  // light: warm glow from lamps, blue cold from windows, flicker/dark
  s += `<rect width="1600" height="900" fill="#0A0C12" opacity="${(1 - L) * 0.48 + 0.30}"/>`;
  s += `<rect width="1600" height="900" fill="url(#bsLamp)" opacity="${0.28 * L}"/>`;
  s += `<rect width="1600" height="900" fill="#3A2A10" opacity="${0.10 * L}"/>`;
  s += `<rect width="1600" height="900" fill="url(#bsVig)"/>`;
  if (L < 0.5) s += `<rect width="1600" height="900" fill="#020306" opacity="${(0.5 - L) * 0.3}"/><rect width="1600" height="900" fill="#3A5A86" opacity="${(0.5 - L) * 0.16}"/>`;
  if (L < 0.5) s += `<rect width="1600" height="900" fill="#2A4466" opacity="${0.16 * (1 - L)}"/>`;
  return s;
};

    s += bg('#3A4250') + `<rect x="0" y="620" width="1600" height="280" fill="#7A6A52"/><path d="M560 640 L760 300 L840 300 L1040 640 Z" fill="#8A5A3A"/><ellipse cx="800" cy="300" rx="44" ry="14" fill="#3A2416"/><path d="M780 300 q-20 60 -10 120 M820 300 q20 70 6 140" stroke="#C8463A" stroke-width="16" fill="none" opacity="0.8"/><rect x="980" y="420" width="220" height="150" fill="#F4EFE2"/><text x="1090" y="480" text-anchor="middle" font-family="Arial" font-weight="900" font-size="28" fill="#2A2420">PARTICIPANT</text><text x="1090" y="530" text-anchor="middle" font-family="Arial" font-size="22" fill="#7A7068">(again)</text>` + vig;

const _EScrBus = EXT_SCREEN;
EXT_SCREEN = function (sh, t, o) {

  const R = sh.busRule;
  if (R && t >= R.t0 && t < R.t0 + (R.d || 2.2)) {
    const d = R.d || 2.2, a = Math.min(clamp((t - R.t0) / 0.25, 0, 1), clamp((R.t0 + d - t) / 0.25, 0, 1));
    s += `<g opacity="${a}" transform="translate(${-40 * (1 - a)} 0)"><rect x="70" y="120" width="${110 + R.text.length * 23}" height="74" rx="8" fill="#C8302A"/><rect x="70" y="120" width="12" height="74" fill="#FFD640"/><text x="100" y="172" font-family="Arial" font-weight="900" font-size="38" fill="#fff">RULE ${R.n}: ${R.text}</text></g>`;
  }
  if (typeof DATA !== 'undefined' && DATA.caps && !sh.noCaps) {
    for (const [a, b, txt] of DATA.caps) if (t >= a && t < b) { s += `<text x="800" y="828" text-anchor="middle" font-family="Arial" font-weight="900" font-size="52" fill="#fff" stroke="#000" stroke-width="10" paint-order="stroke" stroke-linejoin="round">${txt}</text>`; break; }
  }
  return s;
};

// ---------- blueHouse: night street seen from the bus (o.frame = bus window frame), Max's blue house ----------
// opts: wave (mom silhouette waving in the window), boy (wet boy on the porch), car (mom's car in the driveway, o.honk = t of two honks),
//       real (warm, safe version), slide (house slides away: px/s), side 'left'|'right' (only the label of the look)
SETS.blueHouse = (t, o) => {
  let s = busDefs() + `<rect width="1600" height="900" fill="url(#bsSky)"/>`;
  const dx = o.slide ? -(t - (o.t0 || 0)) * o.slide : 0;
  s += `<g transform="translate(${dx} 0)">`;
  for (let i = -1; i < 5; i++) { if (i === 1) continue; const x = 80 + i * 380; s += `<path d="M${x} 430 L${x + 150} 330 L${x + 300} 430 Z" fill="#141A24"/><rect x="${x + 20}" y="430" width="260" height="210" fill="#1A2130"/><rect x="${x + 60}" y="480" width="60" height="60" fill="${hash(i + 3) > 0.5 ? '#3A3A2A' : '#141824'}"/>`; }
  // blue house
  const hx = 460; s += `<path d="M${hx - 30} 400 L${hx + 210} 250 L${hx + 450} 400 Z" fill="#2A3550"/><rect x="${hx}" y="400" width="420" height="250" fill="${o.real ? '#5A7AB0' : '#3E5A8A'}"/>`;
  for (let j = 0; j < 10; j++) s += `<line x1="${hx}" y1="${410 + j * 24}" x2="${hx + 420}" y2="${410 + j * 24}" stroke="#2E4670" stroke-width="2"/>`;
  s += `<rect x="${hx + 40}" y="440" width="130" height="110" fill="#FFD98A"/><rect x="${hx + 40}" y="440" width="130" height="110" fill="none" stroke="#E8E2D4" stroke-width="8"/><line x1="${hx + 105}" y1="440" x2="${hx + 105}" y2="550" stroke="#E8E2D4" stroke-width="5"/>`;
  if (o.wave) { const a = Math.sin(t * 5) * 35; s += `<g transform="translate(${hx + 105} 520)"><circle cx="0" cy="-30" r="20" fill="#16181C"/><rect x="-22" y="-10" width="44" height="40" fill="#16181C"/><line x1="16" y1="-6" x2="${16 + 40 * Math.cos((-60 + a) * Math.PI / 180)}" y2="${-6 + 40 * Math.sin((-60 + a) * Math.PI / 180)}" stroke="#16181C" stroke-width="9" stroke-linecap="round"/></g>`; }
  s += `<rect x="${hx + 260}" y="470" width="80" height="180" fill="#6A4A2E"/><circle cx="${hx + 326}" cy="560" r="5" fill="#D8B45A"/><rect x="${hx + 230}" y="640" width="140" height="18" fill="#8A8A86"/><rect x="${hx + 215}" y="658" width="170" height="16" fill="#7A7A76"/>`;
  s += `<rect x="${hx + 220}" y="440" width="10" height="200" fill="#E8E2D4"/><rect x="${hx + 370}" y="440" width="10" height="200" fill="#E8E2D4"/><rect x="${hx + 210}" y="430" width="180" height="14" fill="#E8E2D4"/><circle cx="${hx + 300}" cy="455" r="8" fill="#FFE3A3"/>`;
  if (o.boy) s += `<g opacity="0.95"><circle cx="${hx + 300}" cy="560" r="22" fill="#0C0E12"/><circle cx="${hx + 292}" cy="556" r="4" fill="#fff"/><circle cx="${hx + 308}" cy="556" r="4" fill="#fff"/><rect x="${hx + 280}" y="582" width="40" height="58" rx="8" fill="#5A6670"/><line x1="${hx + 285}" y1="640" x2="${hx + 285}" y2="${640 + 4 * Math.abs(Math.sin(t * 3))}" stroke="#9FB4CC" stroke-width="2"/></g>`;
  if (o.car) { const hk = o.honk != null && ((t > o.honk && t < o.honk + 0.25) || (t > o.honk + 0.45 && t < o.honk + 0.7)); s += `<g transform="translate(${hx + 520} 600)"><rect x="0" y="0" width="300" height="70" rx="20" fill="#7A2A2A"/><path d="M40 0 L80 -45 L220 -45 L260 0 Z" fill="#6A2424"/><path d="M90 -38 L130 -38 L130 -4 L60 -4 Z" fill="#FFE3A3" opacity="0.6"/><circle cx="70" cy="72" r="26" fill="#121315"/><circle cx="235" cy="72" r="26" fill="#121315"/><circle cx="292" cy="30" r="10" fill="#FFF2C4"/>${hk ? `<path d="M300 30 L520 -20 L520 90 Z" fill="#FFF2C4" opacity="0.25"/>` : `<path d="M300 30 L520 0 L520 70 Z" fill="#FFF2C4" opacity="0.10"/>`}</g>`; }
  s += `<rect x="0" y="650" width="2400" height="250" fill="#1A1E24"/><rect x="0" y="650" width="2400" height="8" fill="#3A4048"/>`;
  s += `<rect x="${hx + 140}" y="600" width="14" height="50" fill="#20252B"/><rect x="${hx + 120}" y="588" width="54" height="22" rx="4" fill="#5A6A80"/><text x="${hx + 147}" y="604" text-anchor="middle" font-family="Arial" font-weight="900" font-size="11" fill="#fff">1408</text>`;
  s += `</g>`;
  for (let i = 0; i < 4; i++) { const y = 560 + i * 60, x = ((t * 14 + i * 400) % 2000) - 400; s += `<ellipse cx="${x + 600}" cy="${y}" rx="800" ry="40" fill="#8A9AAA" opacity="${o.real ? 0.03 : 0.07}" filter="url(#b20)"/>`; }
  if (o.real) s += `<rect width="1600" height="900" fill="#FFB860" opacity="0.06"/>`;
  if (o.frame) s += `<path d="M0 0 H1600 V900 H0 Z M140 110 H1460 Q1500 110 1500 150 V700 Q1500 740 1460 740 H140 Q100 740 100 700 V150 Q100 110 140 110 Z" fill="#CFC4A6" fill-rule="evenodd"/><rect x="100" y="740" width="1400" height="40" fill="#9A9076"/><line x1="800" y1="110" x2="800" y2="740" stroke="#9A9076" stroke-width="24"/><rect width="1600" height="900" fill="#0A0C12" opacity="0.25"/>` + [...Array(14)].map((_, i) => `<circle cx="${150 + hash(i * 3) * 1300}" cy="${130 + hash(i * 7) * 580}" r="${3 + 4 * hash(i)}" fill="#B8CCE0" opacity="0.4"/>`).join('');
  s += `<rect width="1600" height="900" fill="url(#bsVig)"/>`;
  return s;
};

// ---------- realStop: a real bus stop at night (sign + street lamp + houses) ----------
SETS.realStop = (t, o) => {
  let s = busDefs() + `<rect width="1600" height="900" fill="url(#bsSky)"/>`;
  for (let i = 0; i < 6; i++) { const x = i * 290 - 40; s += `<path d="M${x} 470 L${x + 120} 390 L${x + 240} 470 Z" fill="#141A24"/><rect x="${x + 15}" y="470" width="210" height="190" fill="#1A2130"/><rect x="${x + 50}" y="510" width="50" height="50" fill="${hash(i) > 0.4 ? '#FFD98A' : '#141824'}" opacity="0.8"/>`; }
  s += `<rect x="0" y="660" width="1600" height="240" fill="#1A1E24"/><rect x="0" y="650" width="1600" height="14" fill="#3A4048"/>`;
  s += `<rect x="1180" y="300" width="10" height="360" fill="#20252B"/><ellipse cx="1185" cy="300" rx="28" ry="10" fill="#FFE3A3"/><path d="M1185 305 L1060 660 L1310 660 Z" fill="#FFE3A3" opacity="0.12"/>`;
  s += `<rect x="1280" y="420" width="8" height="240" fill="#9AA0A6"/><rect x="1230" y="420" width="110" height="80" rx="6" fill="#2F5E8A"/><text x="1285" y="452" text-anchor="middle" font-family="Arial" font-weight="900" font-size="18" fill="#fff">BUS STOP</text><text x="1285" y="480" text-anchor="middle" font-family="Arial" font-weight="800" font-size="16" fill="#FFD640">${o.name || 'ELM & 2ND'}</text>`;
  s += `<rect width="1600" height="900" fill="url(#bsVig)"/>`;
  return s;
};
</script></body></html>
