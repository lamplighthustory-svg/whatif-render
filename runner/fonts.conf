<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- "Arial", "Comic Sans MS", "Georgia" are free look-alikes renamed by make_fonts.py.
     No aliases on purpose: Chrome's own defaults (sans-serif = Arial, cursive = Comic Sans MS,
     standard = Times New Roman -> Liberation Serif) then resolve exactly like on Windows. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.fonts</dir>
</fontconfig>
