<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make the Linux runner resolve fonts like Chrome on the Windows laptop.
     "Arial", "Comic Sans MS", "Georgia" are free look-alikes renamed by make_fonts.py. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.fonts</dir>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>cursive</family><prefer><family>Comic Sans MS</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
